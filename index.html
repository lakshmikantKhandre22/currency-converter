<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <div class="container">

        <h2>Currency Converter</h2>

        <form>

            <!-- Amount -->

            <div class="amount">

                <label for="amount">
                    Enter Amount
                </label>

                <input
                    type="number"
                    value="100"
                    id="amount"
                    min="1"
                />

            </div>

            <!-- Dropdown -->

            <div class="dropdown">

                <!-- From -->

                <div class="currency-box">

                    <p>From</p>

                    <div class="select-container">

                        <img
                            id="from-flag"
                            src="https://flagsapi.com/US/flat/64.png"
                            alt=""
                        />

                        <select name="from" id="from"></select>

                    </div>

                </div>

                <!-- Swap -->

                <div class="swap-icon" id="swap">
                    ⇄
                </div>

                <!-- To -->

                <div class="currency-box">

                    <p>To</p>

                    <div class="select-container">

                        <img
                            id="to-flag"
                            src="https://flagsapi.com/IN/flat/64.png"
                            alt=""
                        />

                        <select name="to" id="to"></select>

                    </div>

                </div>

            </div>

            <!-- Result -->

            <div class="msg">
                1 USD = 82 INR
            </div>

            <!-- Button -->

            <button type="submit">
                Get Exchange Rate
            </button>

        </form>

    </div>

    <script src="codes.js"></script>

    <script src="script.js"></script>

</body>
</html>
